<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phishing Net</title>
  <style>
    :root {
      --bg: #3a3d42;         
      --bg2: #52565e;       
      --accent: #00d4e0;        /* cyan */
      --accent2: #ff8a2b;       /* orange */
      --card: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
      --muted: #c2c6cc;

      /* risk colors (used only for the risk score) */
      --risk-low: #3ddc84;      /* green  0-34%   */
      --risk-med: #ffd23f;      /* yellow 35-64%  */
      --risk-high: #ff4d4d;     /* red    65-100% */
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .net-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(var(--bg2) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg2) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.8;
    }

    .net-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0, 212, 224, 0.18), transparent 60%);
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    header { text-align: center; margin-bottom: 28px; }
    .logo { font-size: 2rem; font-weight: 700; }
    .logo span { color: var(--accent); }

    .card {
      background: var(--card);
      border: 1px solid rgba(0, 212, 224, 0.35);
      border-radius: 16px;
      padding: 24px;
    }

    .field { margin-bottom: 16px; }

    label, .label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .hint { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea { min-height: 120px; resize: vertical; }
    textarea.short { min-height: 84px; }

    input:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* ---------- attachment drop zone ---------- */
    .dropzone {
      border: 2px dashed rgba(0, 212, 224, 0.55);
      border-radius: 12px;
      padding: 22px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.18);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .dropzone strong { color: var(--accent); }
    .dropzone:hover,
    .dropzone.dragover {
      background: rgba(0, 212, 224, 0.12);
      border-color: var(--accent2);
    }
    .dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    ul.files { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.files li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
    ul.files .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul.files .fsize { color: var(--muted); font-size: 0.75rem; }
    ul.files .sandbox-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 1px 8px;
    }

    /* ---------- buttons ---------- */
    button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #04242a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

    button.secondary {
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      margin-top: 20px;
    }

    button.remove {
      width: auto;
      margin: 0;
      padding: 2px 8px;
      background: transparent;
      color: var(--accent2);
      font-size: 1.1rem;
      line-height: 1;
    }

    /* ---------- results + risk coloring ---------- */
    #results { --risk: var(--risk-high); }
    #results[data-risk="low"]    { --risk: var(--risk-low); }
    #results[data-risk="medium"] { --risk: var(--risk-med); }
    #results[data-risk="high"]   { --risk: var(--risk-high); }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .score-badge { font-size: 2.4rem; font-weight: 800; color: var(--risk); }

    .score-label {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--risk);
      border: 1px solid var(--risk);
      background: rgba(0, 0, 0, 0.2);
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.3);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      width: 98%;
      border-radius: 999px;
      background: var(--risk);
      transition: width 0.3s;
    }

    ul.reasons { list-style: none; padding: 0; margin: 0 0 8px; }

    ul.reasons li {
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent2);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .page-tag {
      text-align: center;
      color: var(--accent);
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    hr.divider {
      border: none;
      border-top: 1px dashed rgba(255, 255, 255, 0.25);
      margin: 56px 0;
    }
  </style>
</head>

<body>
  <div class="net-bg"></div>

  <div class="wrap">

    <header>
      <div class="logo">Phishing<span>Net</span></div>
    </header>

    <!-- ===== PAGE 1: Input ===== -->
    <div class="page-tag">Page 1 — Input</div>
    <div class="card">

      <div class="field">
        <label for="sender">Sender</label>
        <input type="text" id="sender" placeholder="e.g. rewards@oakland.eud" autocomplete="off">
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="Paste the subject line" autocomplete="off">
      </div>

      <div class="field">
        <label for="body">Body</label>
        <textarea id="body" placeholder="Paste the email body here..."></textarea>
      </div>

      <div class="field">
        <label for="links">Suspicious links</label>
        <textarea id="links" class="short" placeholder="http://oaklend/login/rewards"></textarea>
        <p class="hint">One link per line. Don't click them.</p>
      </div>

      <div class="field">
        <span class="label">Attachments</span>
        <div class="dropzone" id="dropzone" tabindex="0" role="button"
             aria-label="Add attachments. Drag and drop files here or press Enter to browse.">
          Drag and drop files here, or <strong>browse</strong>
        </div>
        <input type="file" id="fileInput" multiple hidden>
        <ul class="files" id="fileList"></ul>
  
      </div>

      <button id="submitScan" type="button">Check Risk</button>
      <p class="hint" id="submissionStatus" role="status" aria-live="polite"></p>
    </div>

    <hr class="divider">

    <!-- ===== PAGE 2: Results ===== -->
    <div class="page-tag">Page 2 — Results</div>
    <div class="card" id="results" data-risk="high">
      <div class="score-row">
        <div class="score-badge" id="scoreBadge">98%</div>
        <div class="score-label" id="scoreLabel">High Risk</div>
      </div>
      <div class="progress"><div class="progress-fill" id="scoreBar"></div></div>

      <span class="label">Reasons for Flagging:</span>
      <ul class="reasons">
        <li>Urgent language detected ("act immediately")</li>
        <li>Requests login credentials</li>
        <li>Suspicious Links</li>
      </ul>
      <button class="secondary">Check Another Message</button>
    </div>

  </div>

  <script>
    /*
       0-34%  -> green (low)
       35-64% -> yellow (medium)
       65-100% -> red (high)
       Call setRisk(score) with the score from your checker. */
    function riskLevel(p) {
      if (p <= 34) return "low";
      if (p <= 64) return "medium";
      return "high";
    }

    function setRisk(score) {
      var p = Math.max(0, Math.min(100, Math.round(Number(score) || 0)));
      var level = riskLevel(p);
      var names = { low: "Low Risk", medium: "Medium Risk", high: "High Risk" };
      document.getElementById("results").dataset.risk = level;
      document.getElementById("scoreBadge").textContent = p + "%";
      document.getElementById("scoreLabel").textContent = names[level];
      document.getElementById("scoreBar").style.width = p + "%";
    }

    setRisk(98); 

    
    var dropzone = document.getElementById("dropzone");
    var fileInput = document.getElementById("fileInput");
    var fileList = document.getElementById("fileList");
    var queued = [];

    function fmtSize(b) {
      if (b < 1024) return b + " B";
      if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
      return (b / 1048576).toFixed(1) + " MB";
    }

    function renderFiles() {
      fileList.textContent = "";
      queued.forEach(function (f, i) {
        var li = document.createElement("li");

        var name = document.createElement("span");
        name.className = "fname";
        name.textContent = f.name;

        var size = document.createElement("span");
        size.className = "fsize";
        size.textContent = fmtSize(f.size);

        var tag = document.createElement("span");
        tag.className = "sandbox-tag";
        tag.textContent = "SANDBOX";

        var rm = document.createElement("button");
        rm.type = "button";
        rm.className = "remove";
        rm.setAttribute("aria-label", "Remove " + f.name);
        rm.textContent = "\u00d7";
        rm.addEventListener("click", function () {
          queued.splice(i, 1);
          renderFiles();
        });

        li.append(name, size, tag, rm);
        fileList.appendChild(li);
      });
    }

    function addFiles(files) {
      for (var i = 0; i < files.length; i++) queued.push(files[i]);
      renderFiles();
    }

    dropzone.addEventListener("click", function () { fileInput.click(); });
    dropzone.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener("change", function () {
      addFiles(fileInput.files);
      fileInput.value = "";
    });
    ["dragenter", "dragover"].forEach(function (ev) {
      dropzone.addEventListener(ev, function (e) {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      dropzone.addEventListener(ev, function (e) {
        e.preventDefault();
        dropzone.classList.remove("dragover");
      });
    });
    dropzone.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });

    var submitButton = document.getElementById("submitScan");
    var submissionStatus = document.getElementById("submissionStatus");

    submitButton.addEventListener("click", async function () {
      var payload = {
        emailAddress: document.getElementById("sender").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        emailContent: document.getElementById("body").value.trim(),
        attachedLink: document.getElementById("links").value.trim(),
        attachedFile: queued.map(function (file) { return file.name; }).join(", "),
        riskScore: Number(document.getElementById("scoreBadge").textContent.replace("%", ""))
      };

      if (!payload.emailAddress) {
        submissionStatus.textContent = "Enter a sender address before submitting.";
        return;
      }

      submitButton.disabled = true;
      submissionStatus.textContent = "Submitting scan...";

      try {
        var response = await fetch("/api/scans", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        var result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "The scan could not be saved.");
        }

        submissionStatus.textContent = result.message + " Scan ID: " + result.scanId;
      } catch (error) {
        submissionStatus.textContent = "Submission failed: " + error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
